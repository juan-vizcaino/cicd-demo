name: ci

on: 
  push: 
    branches: [master]

  workflow_dispatch:

jobs:                                                                           # Runs jobs in parallel unless `need` keyword is used.

  test:                                                                         # Job ID      
    name: Test Execute Asserts                                                       # Job Name
    runs-on: ubuntu-latest                                                      # What image to deploy
    steps:                                                                      # What to execute on machine
      - name: Clone Repo Triggering Commit                                      
        uses: actions/checkout@v4                                               # clone the latest code from repo + what version of the instruction to use. 
      
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2       # setup UV + what version of the instruction to use
      - run: uv run pytest                                                      # Run python using UV


  deploy-dev:                                                                   # because no `name` tag was used, this is ID and Name.
    needs: test                                                                 # picks the runner’s OS image.
    runs-on: ubuntu-latest
    environment: DEV                                                            # Setup in GitHub Repo settings under Environments
    steps: 
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run:  uv run src/hello_world.py
        env:                                                                    # sets environment variables for that one step’s process
          ENV_LABEL: ${{ vars.ENV_LABEL }}                                      # copies the GitHub environment variable assignes it to "ENV_LABEL". 

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: QA
    steps:  
      - name: Clone Repo Triggering Commit
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run:  uv run src/hello_world.py
        env: 
          ENV_LABEL: ${{ vars.ENV_LABEL }} 


  deploy-prod: 
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: PROD
    steps: 
      - name: Clone Repo Triggering Commit
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv run src/hello_world.py
        env: 
          ENV_LABEL: ${{ vars.ENV_LABEL }}

