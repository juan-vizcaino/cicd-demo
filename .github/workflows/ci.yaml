name: ci

on: 
  push: 
    branches: [master]

jobs:

  test: 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv run pytest

  run-hello: 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run:  uv run src/hello_world.py